version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: wasl-postgres
    environment:
      POSTGRES_DB: rishta_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rishta_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: wasl-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: wasl-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: waslminioadmin
      MINIO_ROOT_PASSWORD: waslminiopassword123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
